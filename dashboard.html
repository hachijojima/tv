<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Dashboard | FM八丈島 TV</title><link rel="stylesheet" href="style.css"></head>
<body class="candidates-page"><main class="candidate-shell dashboard">
<header class="candidate-head"><p>FM八丈島 TV</p><h1>DASHBOARD</h1><a href="index.html">ON AIR</a></header>
<section class="dashboard-form"><h2>ADMIN LOGIN</h2><p id="auth-status">ログインすると管理機能を利用できます。</p><label>Email<input id="auth-email" type="email" autocomplete="email"></label><label>Password<input id="auth-password" type="password" autocomplete="current-password"></label><button id="auth-submit" type="button">LOGIN</button><button id="auth-logout" type="button" hidden>LOGOUT</button></section>
<section id="admin-panel" class="dashboard-form" hidden><h2>ADD CONTENT</h2><label>Family<select id="family-code"></select></label><label>YouTube URL <small>1行に1本。複数行を同時登録できます。各動画の実durationを自動取得します。</small><textarea id="urls" placeholder="https://www.youtube.com/watch?v=..."></textarea></label><div id="duration-fallbacks" hidden></div><button id="save" type="button">CHECK &amp; SAVE</button><p id="save-status"></p><div id="save-results" aria-live="polite"></div></section>
<section id="library-panel" class="dashboard-form" hidden><h2>PROGRAM FAMILIES</h2><div id="family-list"></div><h2>LIBRARY</h2><input id="library-search" type="search" placeholder="Search library"><div id="library-list"></div></section>
<section><h2>7 DAYS / JST</h2><p class="draft-note">確定済みのDB番組表のみを表示します。</p><button id="generate-week" type="button" hidden>GENERATE / REPLACE 7 DAYS</button><p id="schedule-status"></p><div id="week" class="week-list"></div></section>
</main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="schedule-v3.js"></script><script src="dashboard.js"></script></body></html>

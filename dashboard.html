<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Dashboard | FM八丈島 TV</title><link rel="stylesheet" href="style.css?v=dashboard-views-1"></head>
<body><main class="candidate-shell dashboard dashboard-shell">
  <header class="candidate-head dashboard-head"><div><p>FM八丈島 TV</p><h1>DASHBOARD</h1></div><div class="dashboard-head-actions"><a href="index.html">ON AIR ↗</a><p id="admin-email" hidden></p><button id="logout" type="button" hidden>LOGOUT</button></div></header>
  <section id="login" class="dashboard-form"><h2>ADMIN LOGIN</h2><label>Email<input id="email" type="email" autocomplete="email"></label><label>Password<input id="password" type="password" autocomplete="current-password"></label><button id="login-button" type="button">LOGIN</button><p id="auth-status" aria-live="polite">ログインすると管理機能を利用できます。</p></section>
  <section id="admin" hidden>
    <nav class="dashboard-tabs" aria-label="Dashboard views"><button type="button" data-view="overview" aria-selected="true">OVERVIEW</button><button type="button" data-view="timetable" aria-selected="false">TIMETABLE</button><button type="button" data-view="library" aria-selected="false">LIBRARY</button><button type="button" data-view="hot10" aria-selected="false">HOT 10</button></nav>
    <section class="dashboard-view" data-panel="overview"><div class="overview-grid"><article class="overview-block overview-onair"><p class="candidate-kicker">ON AIR</p><div id="on-air">読み込み中</div><button id="regenerate" type="button">REGENERATE NOW</button><p id="regen-status" aria-live="polite"></p></article><article class="overview-block"><p class="candidate-kicker">TODAY</p><h2 id="today-label">—</h2><p id="today-status" class="candidate-meta">3日分のタイムテーブルを表示します。</p><button type="button" class="view-jump" data-jump="timetable">TIMETABLE →</button></article><article class="overview-block"><p class="candidate-kicker">LIBRARY</p><div id="summary" class="summary-list"></div><button type="button" class="view-jump" data-jump="library">LIBRARY →</button></article><article class="overview-block"><p class="candidate-kicker">HACHIJO HOT 10</p><div id="hot10-preview" class="hot10-preview">読み込み中</div><button type="button" class="view-jump" data-jump="hot10">HOT 10 →</button></article></div></section>
    <section class="dashboard-view" data-panel="timetable" hidden><div class="view-heading"><div><p class="candidate-kicker">3 DAYS</p><h2>TIME TABLE</h2><p class="candidate-meta">DBに確定している編成のみを表示します。</p></div></div><div id="week" class="week-list" aria-live="polite"></div></section>
    <section class="dashboard-view" data-panel="library" hidden><div class="view-heading"><div><p class="candidate-kicker">CONTENT MANAGEMENT</p><h2>LIBRARY</h2></div><button id="add-toggle" type="button">+ ADD CONTENT</button></div><div id="add-form" class="add-panel" hidden><label>Family<select id="family"><option value="music">MUSIC</option><option value="hachijo_taiko">HACHIJO TAIKO</option><option value="power_push">POWER PLAY</option><option value="sports">SPORTS</option><option value="hachijo_picks">HACHIJO PICKS</option></select></label><label>RIGHTS<select id="add-rights"><option value="">UNSET</option><option value="true">CLEARED</option><option value="false">NOT CLEARED</option></select></label><label>YouTube URL<textarea id="urls"></textarea></label><button id="add" type="button">CHECK &amp; SAVE</button><div id="duration-fallbacks" hidden></div><p id="add-status" aria-live="polite"></p></div><div class="library-tools"><input id="search" type="search" placeholder="Search title, channel, category"><div id="family-filters" class="filter-row" aria-label="Family filters"></div><div class="library-tool-row"><div id="rights-filters" class="filter-row" aria-label="Rights filters"></div><label class="sort-label">SORT<select id="sort"><option value="duration-desc">DURATION ↓</option><option value="duration-asc">DURATION ↑</option><option value="title-asc">TITLE A–Z</option><option value="title-desc">TITLE Z–A</option></select></label><button id="export-csv" type="button" class="secondary-button">YouTube CHECK CSV ↓</button></div></div><div id="edit-panel" class="edit-panel" hidden><p class="candidate-kicker">EDIT CONTENT</p><label>Family<select id="edit-family"></select></label><label>Title<input id="edit-title" type="text"></label><label>RIGHTS<select id="edit-rights"><option value="">UNSET</option><option value="true">CLEARED</option><option value="false">NOT CLEARED</option></select></label><button id="edit-save" type="button">SAVE</button><button id="edit-cancel" type="button" class="secondary-button">CANCEL</button></div><div id="library" class="library-list"></div></section>
    <section class="dashboard-view" data-panel="hot10" hidden><div class="view-heading"><div><p class="candidate-kicker">READ ONLY · UP TO 7 DAYS</p><h2>HACHIJO HOT 10</h2></div></div><div id="hot10-days" class="hot10-days" aria-label="HOT 10 dates"></div><div id="hot10-list" class="hot10-admin-list" aria-live="polite"></div></section>
  </section>
</main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js?v=20260824"></script><script src="dashboard.js?v=dashboard-views-1"></script></body></html>

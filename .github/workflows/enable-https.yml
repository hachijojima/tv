name: Enable Pages HTTPS

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  enable-when-ready:
    runs-on: ubuntu-latest
    steps:
      - name: Enable HTTPS after certificate issuance
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          response="$(curl --silent --show-error --request PUT \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data '{"https_enforced":true}' \
            "https://api.github.com/repos/${REPOSITORY}/pages")"
          if echo "$response" | grep -q '"https_enforced":true'; then
            echo "HTTPS is enabled."
          else
            echo "Certificate is not ready yet; the next scheduled run will retry."
          fi
